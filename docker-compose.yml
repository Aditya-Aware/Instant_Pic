services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smpn
      POSTGRES_USER: smpn
      POSTGRES_PASSWORD: smpn_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smpn -d smpn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
